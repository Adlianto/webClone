<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Minji’s iPhone · Minji × Hanni AU</title>

<style>
:root{--ease:cubic-bezier(.32,.72,0,1);--blue:#007aff;--red:#ff3b30;--green:#34c759;--sep:rgba(60,60,67,.29);--grey:#8e8e93;--bg2:#f2f2f7;
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Pretendard Variable",Pretendard,system-ui,sans-serif;color:#000;-webkit-font-smoothing:antialiased;letter-spacing:-.2px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;margin:0;background:radial-gradient(ellipse at 50% 30%,#2a2a30,#0b0b0d 70%);overflow:hidden;overscroll-behavior:none}
body{display:flex;align-items:center;justify-content:center}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
button{border:0;background:none;padding:0;cursor:pointer}
img{-webkit-user-drag:none}
svg{display:block}
#phone{position:relative;width:min(100vw,calc((100dvh - 36px)*.4613),430px);aspect-ratio:393/852;border-radius:58px;overflow:hidden;background:#000;
 box-shadow:0 0 0 10px #121214,0 0 0 12px #3b3b40,0 0 0 13px #18181a,0 40px 90px rgba(0,0,0,.8);isolation:isolate;transform:translateZ(0)}
#phone.mob{border-radius:0;box-shadow:none;aspect-ratio:auto}
#screen{position:absolute;inset:0;overflow:hidden}
#wall{position:absolute;inset:-2px;background:linear-gradient(180deg,#0005,transparent 40%,#0006),url('assets/photo-0.jpg') 52% center/cover;transition:filter .45s,transform .45s}
#wall.dim{filter:blur(24px) brightness(.62);transform:scale(1.08)}
.layer{position:absolute;inset:0}
#homeL,#appL{visibility:hidden}
#appL{z-index:20;background:#fff;overflow:hidden}
#ov{position:absolute;inset:0;z-index:60;pointer-events:none}
#ov>*{pointer-events:auto}

/* status bar / island / home indicator */
#sb{position:absolute;z-index:80;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:6px 30px 0 44px;pointer-events:none;color:#000;transition:color .3s}
#sb.light{color:#fff}
#sb .t{font-size:17px;font-weight:600;letter-spacing:-.3px;width:60px;text-align:center}
#sbk{display:none;position:absolute;left:22px;top:6px;height:48px;min-width:92px;padding:0 6px;align-items:center;gap:3px;font-size:14px;font-weight:600;color:inherit;pointer-events:auto;cursor:pointer;white-space:nowrap}
#sbk svg{width:7px;height:12px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#sbk:active{opacity:.45}
#sb.crumb #sbk{display:flex}
#sb.crumb .t{visibility:hidden}
#sb .r{display:flex;gap:6px;align-items:center}
#sb svg{fill:currentColor}
#island{position:absolute;z-index:90;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;background:#000;border-radius:20px;transition:width .5s var(--ease),height .5s var(--ease),border-radius .5s var(--ease);display:flex;align-items:center;justify-content:space-between;padding:0 10px;overflow:hidden}
#island .ia,#island .ib{opacity:0;transition:opacity .3s}
#island.act{width:200px}
#island.act .ia,#island.act .ib{opacity:1}
#island .ia{width:22px;height:22px;border-radius:6px;background:#333 center/cover}
#island .ib{display:flex;gap:2px;align-items:center;height:16px}
#island .ib i{width:3px;background:#ff5d7e;border-radius:2px;animation:eq .9s ease-in-out infinite alternate}
#island .ib i:nth-child(2){animation-delay:-.3s}#island .ib i:nth-child(3){animation-delay:-.6s}#island .ib i:nth-child(4){animation-delay:-.15s}
@keyframes eq{from{height:4px}to{height:15px}}
#hb{position:absolute;z-index:85;bottom:0;left:0;right:0;height:34px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;cursor:pointer;touch-action:none}
#hb i{width:139px;height:5px;border-radius:3px;background:#000;transition:background .3s,transform .2s}
#hb.light i{background:#fff}
#hb:hover i{transform:scaleX(1.06)}
#hb.pulse i{animation:hbp 1.6s ease-in-out 2}
@keyframes hbp{50%{transform:scaleX(1.25) translateY(-3px);opacity:.6}}

/* lock */
#lockL{z-index:30;color:#fff}
#lkc{position:absolute;inset:0;touch-action:none}
.lk-date{position:absolute;top:84px;width:100%;text-align:center;font-size:21px;font-weight:600;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.lk-time{position:absolute;top:104px;width:100%;text-align:center;font-size:104px;font-weight:600;letter-spacing:-3px;line-height:1.1;text-shadow:0 2px 20px rgba(0,0,0,.2);font-feature-settings:"tnum"}
.lk-notes{position:absolute;left:9px;right:9px;bottom:132px;display:flex;flex-direction:column;gap:8px}
.ncard{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-radius:22px;background:rgba(240,240,245,.55);-webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);color:#111;text-align:left;width:100%}
.ncard .ni{width:38px;height:38px;border-radius:9px;overflow:hidden;flex:none}
.ncard .nt{flex:1;min-width:0}
.ncard .nh{display:flex;justify-content:space-between;font-size:15px;font-weight:600}
.ncard .nh small{font-weight:400;color:rgba(0,0,0,.5);font-size:13px}
.ncard .nb{font-size:15px;line-height:1.3;margin-top:1px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.lk-btn{position:absolute;bottom:46px;width:50px;height:50px;border-radius:50%;background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);display:grid;place-items:center;transition:transform .15s}
.lk-btn:active{transform:scale(1.15);background:rgba(255,255,255,.4)}
.lk-langw{position:absolute;top:228px;width:100%;text-align:center;z-index:2}
.lk-lang{display:inline-flex;align-items:center;gap:5px;padding:6px 12px 6px 9px;border-radius:16px;background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#fff;font-size:13px;font-weight:500;opacity:.9;transition:transform .15s}
.lk-lang:active{transform:scale(1.08);background:rgba(255,255,255,.35)}
.lk-lang svg{width:15px;height:15px}
#langSheet{position:absolute;inset:0;z-index:150;background:rgba(0,0,0,.35);display:flex;flex-direction:column;justify-content:flex-end;padding:0 8px 30px}
#langSheet .ls-g{background:rgba(250,250,252,.88);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border-radius:14px;overflow:hidden;color:#000}
#langSheet .ls-h{padding:13px 16px;text-align:center;font-size:13px;color:#8e8e93;border-bottom:.5px solid rgba(60,60,67,.29)}
#langSheet .ls-g button{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;padding:15px;font-size:19px;color:#007aff;position:relative}
#langSheet .ls-g button+button{border-top:.5px solid rgba(60,60,67,.29)}
#langSheet .ls-g button.on{font-weight:600}
#langSheet .ls-c{margin-top:8px;background:#fff;border-radius:14px;padding:16px;font-size:19px;font-weight:600;color:#007aff;width:100%}
.lk-hint{position:absolute;bottom:42px;width:100%;text-align:center;font-size:14px;font-weight:500;opacity:.85;animation:hint 2.4s ease-in-out infinite;pointer-events:none}
@keyframes hint{0%,100%{opacity:.2;transform:translateY(0)}50%{opacity:.85;transform:translateY(-4px)}}
#pinL{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;color:#fff;padding-top:118px}
#pinL .pt{font-size:20px;font-weight:500}
.pdots{display:flex;gap:22px;margin:22px 0 40px}
.pdots i{width:13px;height:13px;border-radius:50%;border:1.4px solid #fff;transition:background .1s}
.pdots i.on{background:#fff}
.pdots.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}
.pkeys{display:grid;grid-template-columns:repeat(3,78px);gap:15px 25px}
.pk{width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .35s}
.pk.dn{background:rgba(255,255,255,.55);transition:none}
.pk b{font-size:36px;font-weight:400;line-height:1}
.pk small{font-size:10px;font-weight:700;letter-spacing:2px;margin-top:2px;min-height:12px}
.pbot{position:absolute;bottom:48px;left:46px;right:46px;display:flex;justify-content:space-between;font-size:16px}

/* home */
#homeL{z-index:10;transform-origin:50% 50%}
.hgrid{position:absolute;top:68px;left:20px;right:20px;display:grid;grid-template-columns:repeat(4,1fr);row-gap:24px;justify-items:center}
.app{display:flex;flex-direction:column;align-items:center;gap:5px;width:74px;transition:transform .15s,filter .15s}
.app:active{transform:scale(.9);filter:brightness(.8)}
.icon{position:relative;width:62px;height:62px;border-radius:14.5px;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.icon .ic{width:100%;height:100%;border-radius:inherit;overflow:hidden}
.icon .ic svg{width:100%;height:100%}
.lbl{color:#fff;font-size:12px;font-weight:500;text-shadow:0 1px 4px rgba(0,0,0,.45);white-space:nowrap}
.bdg{position:absolute;top:-6px;right:-7px;min-width:23px;height:23px;padding:0 6px;border-radius:12px;background:#ff3b30;color:#fff;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center}
.widget{grid-column:span 2;grid-row:span 2;width:calc(100% - 8px);aspect-ratio:1;border-radius:24px;padding:15px 16px;text-align:left;transition:transform .15s;overflow:hidden;position:relative}
.widget:active{transform:scale(.95)}
.wcal{background:#fff;color:#000;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.wcal .wd{color:#ff3b30;font-size:13px;font-weight:700}
.wcal .wn{font-size:46px;font-weight:300;line-height:1;margin:2px 0 8px}
.wcal .we{font-size:13px;font-weight:600;padding-left:7px;border-left:3px solid #af52de;margin-top:5px;line-height:1.25}
.wcal .we small{display:block;color:var(--grey);font-weight:400;font-size:12px}
.wwx{background:linear-gradient(160deg,#627e91,#95a8b1);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.wwx .c{font-size:15px;font-weight:600}.wwx .tp{font-size:44px;font-weight:300;line-height:1.1}
.wwx .ds{position:absolute;left:16px;bottom:14px;font-size:13px;font-weight:600;line-height:1.35}
.wwx .ds small{display:block;font-weight:500}
.hdots{position:absolute;bottom:126px;left:0;right:0;display:none}
.spot{position:absolute;bottom:126px;left:50%;transform:translateX(-50%);padding:6px 13px;border-radius:20px;background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#fff;font-size:13px;font-weight:600;display:flex;gap:5px;align-items:center}
.dock{position:absolute;bottom:14px;left:12px;right:12px;height:94px;border-radius:34px;background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(30px) saturate(1.6);backdrop-filter:blur(30px) saturate(1.6);display:flex;justify-content:space-around;align-items:center;padding:0 6px}
.dock .lbl{display:none}

/* generic page */
.pg{position:absolute;inset:0;background:#fff;overflow:hidden;will-change:transform}
.pg.grouped{background:var(--bg2)}
.pg.dark{background:#000;color:#fff}
.pg.pushed{box-shadow:-10px 0 30px rgba(0,0,0,.12)}
.nav{position:absolute;z-index:6;top:0;left:0;right:0;height:98px;padding:54px 8px 0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;transition:background .25s,box-shadow .25s}
.pg.scrolled .nav,.nav.solid{background:rgba(249,249,249,.86);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px);box-shadow:0 .5px 0 var(--sep)}
.pg.dark.scrolled .nav{background:rgba(22,22,22,.86);box-shadow:0 .5px 0 rgba(255,255,255,.15)}
.nb-back{display:flex;align-items:center;gap:1px;color:var(--blue);font-size:17px;justify-self:start;height:44px;padding-right:8px}
.nb-back svg{width:13px;height:21px;stroke:currentColor;margin-right:5px}
.nb-title{font-size:17px;font-weight:600;opacity:0;transition:opacity .2s;white-space:nowrap}
.pg.scrolled .nb-title,.nav.solid .nb-title{opacity:1}
.nb-right{justify-self:end;display:flex;gap:18px;align-items:center;white-space:nowrap;color:var(--blue);font-size:17px;padding-right:8px}
.nb-right svg{stroke:currentColor;fill:none}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-top:98px;padding-bottom:110px;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{display:none}
.lt{font-size:34px;font-weight:700;letter-spacing:.3px;margin:2px 16px 8px;line-height:41px}
.srch{margin:0 16px 14px;height:36px;border-radius:10px;background:rgba(118,118,128,.12);display:flex;align-items:center;gap:6px;padding:0 8px;color:var(--grey);font-size:17px}
.dark .srch{background:rgba(118,118,128,.24)}
.srch svg{width:16px;stroke:var(--grey);fill:none}
.sh{font-size:20px;font-weight:700;margin:18px 16px 8px}
.gh{font-size:13px;color:var(--grey);text-transform:uppercase;margin:22px 32px 7px}
.group{margin:0 16px;background:#fff;border-radius:11px;overflow:hidden}
.dark .group{background:#1c1c1e}
.row{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 16px;position:relative;width:100%;text-align:left;font-size:17px}
.row.tap:active{background:#e5e5ea}
.row+.row::before,.cell+.cell::before{content:'';position:absolute;top:0;left:var(--inset,16px);right:0;height:.5px;background:var(--sep)}
.dark .row+.row::before{background:rgba(255,255,255,.15)}
.chev{width:8px;height:13px;stroke:#c4c4c7;fill:none;stroke-width:2;flex:none}
.muted{color:var(--grey)}
.tabbar{position:absolute;z-index:6;bottom:0;left:0;right:0;height:84px;padding:7px 0 30px;display:flex;background:rgba(249,249,249,.92);-webkit-backdrop-filter:blur(20px) saturate(1.8);backdrop-filter:blur(20px) saturate(1.8);box-shadow:0 -.5px 0 var(--sep)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:#999;font-size:10px;font-weight:500}
.tabbar svg{width:28px;height:26px;stroke:currentColor;fill:none;stroke-width:1.7}
.tabbar .on{color:var(--blue)}
.dark .tabbar{background:rgba(22,22,22,.92);box-shadow:0 -.5px 0 rgba(255,255,255,.12)}
.toolbar{position:absolute;bottom:0;left:0;right:0;height:84px;padding:10px 20px 30px;display:flex;justify-content:space-between;align-items:flex-start;background:rgba(249,249,249,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 -.5px 0 var(--sep);color:var(--blue);font-size:12px;z-index:6}
.toolbar svg{width:24px;height:24px;stroke:var(--blue);fill:none;stroke-width:1.8}
.seg{display:flex;background:rgba(118,118,128,.12);border-radius:9px;padding:2px;font-size:13px;font-weight:600}
.seg button{padding:5px 14px;border-radius:7px;color:#000}
.seg .on{background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 1px rgba(0,0,0,.1)}
.sw{position:relative;width:51px;height:31px;border-radius:16px;background:#e9e9eb;transition:background .25s;flex:none}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.1);transition:transform .25s var(--ease)}
.sw.on{background:var(--green)}.sw.on::after{transform:translateX(20px)}
.dark .sw{background:#39393d}.dark .sw.on{background:var(--green)}

/* kakao */
.kk{background:#fff}
.kk-h{position:absolute;z-index:5;top:0;left:0;right:0;padding:58px 18px 8px;display:flex;justify-content:space-between;align-items:center;background:#fff}
.kk-h b{font-size:22px;font-weight:700}
.kk-h span{display:flex;gap:18px}.kk-h svg{width:24px;height:24px;stroke:#111;fill:none;stroke-width:1.7}
.kk .scroll{padding-top:104px}
.crow{display:flex;gap:12px;align-items:center;padding:8px 18px;width:100%;text-align:left}
.crow:active{background:#f3f3f3}
.av{width:48px;height:48px;border-radius:18px;flex:none;overflow:hidden;background:#a9c0d6;display:grid;place-items:center}
.av img{width:100%;height:100%;object-fit:cover}
.av svg{width:70%;height:70%}
.crow .cn{font-size:15.5px;font-weight:600;display:flex;gap:5px;align-items:center}
.crow .cn small{color:#aaa;font-weight:500;font-size:14px}
.crow .cp{font-size:13.5px;color:#888;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .cm{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none;align-self:flex-start;padding-top:4px}
.crow .ct{font-size:11.5px;color:#aaa}
.kbdg{min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:#fa5a3c;color:#fff;font-size:11.5px;font-weight:600;display:flex;align-items:center;justify-content:center}
.kk .tabbar{background:#fff;box-shadow:0 -.5px 0 #e5e5e5}
.kk .tabbar button{color:#b3b3b3}.kk .tabbar .on{color:#111}
.chat{background:#b2c7d9;display:flex;flex-direction:column}
.chat-h{flex:none;height:100px;padding:54px 10px 0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:#b2c7d9;position:relative;z-index:3}
.chat-h .bk{display:flex;align-items:center;gap:2px;font-size:16px;color:#111;height:40px;padding:0 6px}
.chat-h .bk svg{width:12px;height:20px;stroke:#111;fill:none;stroke-width:2.2}
.chat-h .nm{font-size:16.5px;font-weight:600;display:flex;gap:5px;align-items:center}
.chat-h .nm small{color:#555;font-weight:500}
.chat-h .rt{justify-self:end;display:flex;gap:16px;padding-right:6px}.chat-h .rt svg{width:23px;height:23px;stroke:#111;fill:none;stroke-width:1.7}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:4px 10px 14px;scrollbar-width:none;overscroll-behavior:contain}
.msgs::-webkit-scrollbar{display:none}
.dpill{display:flex;justify-content:center;margin:14px 0 10px}
.dpill span{background:rgba(0,0,0,.14);color:#fff;font-size:11.5px;padding:5px 12px;border-radius:14px;display:flex;gap:5px;align-items:center}
.ln{display:flex;align-items:flex-end;gap:5px;margin-top:4px}
.ln.me{flex-direction:row-reverse}
.ln.th{padding-left:45px}
.ln.th.first{padding-left:0;align-items:flex-start;margin-top:10px}
.ln .sav{width:40px;height:40px;border-radius:15px;overflow:hidden;flex:none;background:#a9c0d6;display:grid;place-items:center}
.ln .sav img{width:100%;height:100%;object-fit:cover}.ln .sav svg{width:70%;height:70%}
.ln .col{display:flex;flex-direction:column;width:calc(100% - 45px);max-width:calc(100% - 45px);min-width:0}
.ln.th:not(.first) .col{width:100%;max-width:100%}
.ln.me .col{width:88%;max-width:88%}
.ln .who{font-size:12px;color:#4a4a4a;margin:1px 0 4px 2px}
.ln .wrap{display:flex;align-items:flex-end;gap:5px;width:100%;min-width:0;max-width:100%}
.ln.me .wrap{justify-content:flex-end}
.ln.th.first .wrap{}
.bb{padding:9px 12px;border-radius:15px;font-size:15px;line-height:1.45;word-break:normal;overflow-wrap:break-word;hyphens:none;white-space:pre-wrap;position:relative;max-width:calc(100% - 50px);min-width:0;color:#111;text-align:left}
.th .bb{background:#fff}
.me .bb{background:#fee500}
.ln.th.first .bb{border-top-left-radius:4px}
.ln.me.first .bb{border-top-right-radius:4px}
.tm{font-size:10px;color:#556270;white-space:nowrap;flex:none;margin-bottom:1px;display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.me .tm{align-items:flex-end}
.tm .rd{color:#d8a400;font-weight:700;font-size:10.5px}
.bb.img{padding:0;background:none!important;overflow:hidden;border-radius:14px}
.bb.img img{display:block;width:min(200px,52vw);max-height:250px;object-fit:cover}
.bb.exp{padding:0;width:150px;height:150px;border-radius:14px;background:#e9edf1!important;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#8b95a1;font-size:12px}
.bb.exp svg{width:34px;stroke:#a9b3be;fill:none;stroke-width:1.5}
.bb.file{display:flex;gap:10px;align-items:center;min-width:200px;background:#fff!important}

let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,t0,dur,vol=.12,type='sine'){if(!appPrefs.sound)return;const a=ac();if(!a)return;const t=a.currentTime+t0,o=a.createOscillator(),gn=a.createGain();o.type=type;o.frequency.value=f;gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(vol,t+.008);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(gn).connect(a.destination);o.start(t);o.stop(t+dur+.05)}
function sfx(k){if(k==='key')tone(2400,0,.025,.035,'triangle');else if(k==='msg'){tone(1046,0,.22,.09);tone(1397,.1,.32,.09)}else if(k==='send'){tone(620,0,.07,.05);tone(930,.05,.09,.05)}else if(k==='unlock'){tone(1300,0,.05,.04,'triangle');tone(1700,.04,.05,.03,'triangle')}else if(k==='lock')tone(500,0,.06,.05,'triangle')}
function ringOnce(){[[784,0],[988,.2],[1175,.4],[988,.6],[784,1.0],[988,1.2],[1175,1.4],[1319,1.6]].forEach(([f,t])=>{tone(f,t,.35,.11);tone(f*2,t,.18,.03)})}

const PARENT={note:'notes',chat:'kakao',maild:'mail',reel:'instagram',screentime:'settings'};
const rootOf=v=>PARENT[v]||v;
function viewDark(){if(['lock','pin','home'].includes(view))return true;const p=APP.lastElementChild;return!!(p&&p.dataset.dark)}
function wireScroll(pg){const sc=pg.querySelector('.scroll');if(sc)sc.addEventListener('scroll',()=>pg.classList.toggle('scrolled',sc.scrollTop>38),{passive:true})}
function show(id,anim='swap'){
 const old=[...APP.children];old.forEach(o=>{o.querySelectorAll('video').forEach(v=>v.pause())});
 if(PLAYER.dataset.voice&&!(id==='chat')){PLAYER.pause()}
 view=id;const v=VIEWS[id]();const pg=document.createElement('div');pg.className='pg '+(v.cls||'');pg.innerHTML=v.html;pg.dataset.view=id;pg.dataset.dark=v.dark?'1':'';
 if(anim==='pop')APP.insertBefore(pg,APP.firstChild);else APP.appendChild(pg);
 setStatus(v.dark);wireScroll(pg);
 const done=()=>old.forEach(o=>o.remove());
 if(anim==='push'){pg.classList.add('pushed');pg.animate([{transform:'translateX(100%)'},{transform:'none'}],T);old.forEach(o=>o.animate([{transform:'none',filter:'brightness(1)'},{transform:'translateX(-28%)',filter:'brightness(.92)'}],T));setTimeout(done,T.duration)}
 else if(anim==='pop'){pg.animate([{transform:'translateX(-28%)',filter:'brightness(.92)'},{transform:'none',filter:'brightness(1)'}],T);old.forEach(o=>{o.classList.add('pushed');o.animate([{transform:'none'},{transform:'translateX(100%)'}],{...T,fill:'forwards'})});setTimeout(done,T.duration)}
 else done();
 v.init&&v.init(pg);updateIsland();return pg}
function zoomFrames(r){const W=SCREEN.clientWidth,H=SCREEN.clientHeight,s=r.w/W,iy=Math.max(0,(H-r.h/s)/2),dx=r.x+r.w/2-W/2,dy=r.y+r.h/2-H/2;
 return[{transform:`translate(${dx}px,${dy}px) scale(${s})`,clipPath:`inset(${iy}px 0px round ${15/s}px)`,opacity:.25},{transform:'translate(0px,0px) scale(1)',clipPath:`inset(0px 0px round ${devRadius()}px)`,opacity:1}]}
function openApp(id,el){if(callState)return;if(view!=='home'){return}
 lastRect=el?relRect(el):null;APP.innerHTML='';show(id,'none');const tok=++animTok;
 APP.style.visibility='visible';APP.getAnimations().forEach(a=>a.cancel());
 APP.animate(zoomFrames(lastRect||{x:166,y:396,w:60,h:60}),{duration:540,easing:'cubic-bezier(.2,.9,.22,1)'});
 HOME.animate([{transform:'none',opacity:1},{transform:'scale(1.1)',opacity:0}],{duration:400,easing:'ease-in'}).onfinish=()=>{if(tok===animTok&&view!=='home')HOME.style.visibility='hidden'};
 if(firstOpen){firstOpen=false;setTimeout(()=>{$('#hb').classList.add('pulse');setTimeout(()=>$('#hb').classList.remove('pulse'),3400)},900)}}
function closeApp(){if(callState||['home','lock','pin'].includes(view))return;
 const root=rootOf(view);if(PLAYER.dataset.voice)PLAYER.pause();
 view='home';renderHome();HOME.style.visibility='visible';setStatus(true);
 const icon=HOME.querySelector(`.app[data-app="${root}"] .icon`);const r=icon?relRect(icon):{x:166,y:396,w:60,h:60};
 const tok=++animTok;APP.getAnimations().forEach(a=>a.cancel());
 const a=APP.animate(zoomFrames(r).reverse(),{duration:460,easing:'cubic-bezier(.3,.75,.2,1)',fill:'forwards'});
 a.onfinish=()=>{if(tok!==animTok)return;APP.style.visibility='hidden';APP.querySelectorAll('video').forEach(v=>v.pause());APP.innerHTML='';a.cancel()};
 HOME.animate([{transform:'scale(1.1)',opacity:0},{transform:'none',opacity:1}],{duration:460,easing:'cubic-bezier(.2,.9,.22,1)'});updateIsland()}
function push(id){show(id,'push')}
function back(){if(PARENT[view])show(PARENT[view],'pop');else closeApp()}
function hbAction(){if(callState)return;const vw=OV.querySelector('.viewer');if(vw)return closeViewer();
 if(view==='lock')return goPin();if(view==='pin')return;if(view==='home')return HOME.animate([{transform:'none'},{transform:'scale(.97)'},{transform:'none'}],250);closeApp()}
(function hbGesture(){const hb=$('#hb');let y0=null;hb.addEventListener('pointerdown',e=>{y0=e.clientY;hb.setPointerCapture(e.pointerId)});hb.addEventListener('pointerup',e=>{if(y0===null)return;y0=null;hbAction()});hb.addEventListener('pointercancel',()=>{y0=null})})();
function edgeBackIntent(dx,dy){return dx>90&&Math.abs(dx)>Math.abs(dy)*1.3}
(function edgeBack(){let x0=null,y0=0,pg=null;
 const cancel=()=>{x0=null;if(pg)pg.style.transform='';pg=null};
 SCREEN.addEventListener('pointerdown',e=>{const r=SCREEN.getBoundingClientRect();if(callState||!PARENT[view]||(e.clientX-r.left)/SC>22)return;x0=e.clientX;y0=e.clientY;pg=APP.lastElementChild});
 SCREEN.addEventListener('pointermove',e=>{if(x0===null)return;const dx=(e.clientX-x0)/SC,dy=(e.clientY-y0)/SC;if(Math.abs(dy)>8&&Math.abs(dy)>Math.abs(dx)){cancel();return}if(pg)pg.style.transform=`translateX(${Math.max(0,dx)}px)`});
 SCREEN.addEventListener('pointerup',e=>{if(x0===null)return;const commit=edgeBackIntent((e.clientX-x0)/SC,(e.clientY-y0)/SC);cancel();if(commit)back()});
 SCREEN.addEventListener('pointercancel',cancel);
})();
/* 뒤로가기: 상태바 '◀ 홈' + 브라우저/안드로이드 뒤로 버튼 + Backspace + 마우스 뒤로 버튼 */
function goBack(){if(callState)return;const ls=document.getElementById('langSheet');if(ls){ls.remove();return}
 if(OV.querySelector('.viewer'))return closeViewer();
 if(['lock','pin','home'].includes(view)){if(view==='pin')pinCancel();return}back()}
function updateCrumb(){const on=!['lock','pin','home'].includes(view)&&!callState;$('#sb').classList.toggle('crumb',on)}
$('#sbk').innerHTML=`<svg viewBox="0 0 7 12"><path d="M6 1 1 6l5 5"/></svg>${t('home')}`;

document.addEventListener('keydown',e=>{if(e.key==='Escape')hbAction();else if(e.key==='Backspace'&&!e.target.closest('input,textarea')){e.preventDefault();goBack()}});

try{history.pushState({wb:1},'');addEventListener('popstate',()=>{goBack();history.pushState({wb:1},'')})}catch(e){}

 for(let d=1;d<=days;d++){const dow=(first+d-1)%7,has=nov&&(d===6||!!events[d]),td=nov&&d===21;c+=`<button class="cal-d ${td?'td':''} ${d===selectedDay?'sel':''} ${dow===0||dow===6?'we':''}" onclick="selectedDay=${d};show('calendar')"><span>${d}</span>${has?'<i></i>':''}</button>`}

 setStatus(true);const locked=['lock','pin'].includes(callPrev);c.classList.toggle('act',callState!=='ring');
 if(callState==='ring'){c.innerHTML=callTop()+`<div class="csub">${t('mobile')}</div>`+(locked?`<div class="ring-top"><div class="cb"><span class="cc" style="width:50px;height:50px">${G.bellF}</span>${t('remind')}</div><div class="cb"><span class="cc" style="width:50px;height:50px">${G.msgF}</span>${t('message2')}</div></div><div class="slider" id="slider"><div class="kn">${G.handset}</div><span>${t('slideAnswer')}</span></div>`:

function deleteXPost(id){if(!xState.posts.some(p=>p.id===id))return;xState.posts=xState.posts.filter(p=>p.id!==id);xState.replies=xState.replies.filter(p=>p.postId!==id);if(xState.draft.replyTo===id)xState.draft.replyTo='';if(xState.draft.quoteId===id)xState.draft.quoteId='';for(const set of Object.values(xReactions))set.delete(id);saveX();closeSheet();if(view==='xpost'&&xPostId===id)xBack();else show(view);toastAU('Post deleted');}

function xQuoteHTML(id){const p=xPost(id);return p?`<button class="x-quote" onclick="event.stopPropagation();openXPost('${id}')"><b>${esc(p.name)} <span>AU · @${p.handle}</span></b><p>${esc(p.text)}</p></button>`:'<div class="x-quote">This post is unavailable.</div>';}
function xAUPostHTML(p,detail=false){return `<article class="x-post x-native ${detail?'x-detail-post':''}" id="x-au-${p.id}">${xAvatar(p.handle,'x-native-avatar')}<div class="x-native-content"><div class="x-native-author"><button class="x-author-name" onclick="openXProfile('${p.handle}')">${esc(p.name)}</button><span class="x-au-label">AU</span><small>@${p.handle}</small><span class="x-post-time">· ${esc(p.time)}</span><button class="x-more" onclick="xPostMenu('${p.id}')" aria-label="Post options">${X_MORE}</button></div>${detail?'<div class="x-post-body">':`<button class="x-post-body" onclick="openXPost('${p.id}')">`}<span class="x-post-text">${esc(p.text)}</span>${detail?'</div>':'</button>'}${p.media?`<button class="x-post-media" onclick="openXMedia('${p.media}')"><img src="${p.media}" alt="Attached AU photo"></button>`:''}${p.quoteId?xQuoteHTML(p.quoteId):''}${detail?`<div class="x-detail-date">${esc(p.time)} · Oct 21, 2026 · SOFT LAUNCH AU</div>`:''}${xActions(p)}</div></article>`;}

function xFeedHTML(){let posts=xPosts();if(xTimeline==='following')posts=posts.filter(p=>p.handle===X_SELF||xState.following.includes(p.handle)||xReactions.repost.has(p.id));return posts.map((p,i)=>xAUPostHTML(p)+(xTimeline==='forYou'&&i%2===1&&i<6?xPostHTML(X_POSTS[(i-1)/2]):'')).join('');}

function xDrawer(){xSheet('Account',`<div class="x-drawer-profile">${xAvatar(X_SELF)}<b>Minji</b><small>@${X_SELF}</small><p>SOFT LAUNCH · fictional AU</p><span><b>${xState.following.length}</b> Following</span></div><button class="x-sheet-row" onclick="closeSheet();openXProfile('${X_SELF}')">${G.person}Profile</button><button class="x-sheet-row" onclick="closeSheet();xNavigate('xbookmarks')">${X_BOOKMARK}Bookmarks</button><button class="x-sheet-row" onclick="closeSheet();openXComposer()">${G.pen}Drafts${xState.draft.text||xState.draft.media?' · 1':''}</button><button class="x-sheet-row" onclick="closeSheet();push('settings')">${G.gear}Settings</button>${!xStorageOK?'<p class="settings-footnote">Saving is unavailable. Keep this tab open to keep changes.</p>':''}`);OV.querySelector('.au-sheet')?.classList.add('x-drawer');}

function setXTimeline(tab){if(!['forYou','following'].includes(tab)||tab===xTimeline)return;xRemember();xTimeline=tab;show('x');}
function xTimelineInit(pg){xPageInit(pg);if(xTimeline==='forYou')mountXPosts(pg);const feed=pg.querySelector('.x-feed');if(!feed)return;let start=null;feed.addEventListener('touchstart',e=>{const t=e.touches[0];start={x:t.clientX,y:t.clientY,top:feed.scrollTop};},{passive:true});feed.addEventListener('touchend',e=>{if(!start)return;const t=e.changedTouches[0],dx=t.clientX-start.x,dy=t.clientY-start.y;if(start.top===0&&dy>85&&Math.abs(dx)<40)refreshX();else if(Math.abs(dx)>95&&Math.abs(dy)<45)setXTimeline(dx<0?'following':'forYou');start=null;},{passive:true});}
VIEWS.x=()=>({cls:'x-app',dark:false,html:xHeader()+`<div class="x-tabs" role="tablist" aria-label="Timeline"><button role="tab" aria-selected="${xTimeline==='forYou'}" onclick="setXTimeline('forYou')"><span>For you</span></button><button role="tab" aria-selected="${xTimeline==='following'}" onclick="setXTimeline('following')"><span>Following</span></button></div><div class="scroll x-feed">${xFeedHTML()}<p class="x-feed-end">You’re all caught up.</p></div><button class="x-compose" onclick="openXComposer()" aria-label="Compose post">${G.pen}</button>`+xNav(),init:xTimelineInit});

function openXComposer(replyTo='',quoteId=''){
 if((replyTo&&!xPost(replyTo))||(quoteId&&!xPost(quoteId)))return;
 const d=xState.draft;if((d.text||d.media)&&(d.replyTo!==replyTo||d.quoteId!==quoteId))toastAU('Resuming your saved draft.');else if(!d.text&&!d.media){d.replyTo=replyTo;d.quoteId=quoteId;saveX();}
 xNavigate('xcompose');
}
function updateXDraft(text){xState.draft.text=String(text).slice(0,2000);saveX();const n=Array.from(xState.draft.text).length,valid=(!!xState.draft.text.trim()||!!xState.draft.media||!!xState.draft.quoteId)&&n<=280;$('#x-draft-count').textContent=n+'/280';$('#x-draft-count').classList.toggle('over',n>280);$('#x-submit-post').disabled=!valid;}
function cancelXComposer(){saveX();xBack();}
function discardXDraft(){xState.draft={text:'',replyTo:'',quoteId:'',media:''};saveX();show('xcompose');}
function xPhotoPicker(){xSheet('Add a photo',`<div class="x-photo-picker">${Array.from({length:6},(_,i)=>`<button onclick="setXDraftPhoto('assets/photo-${i}.jpg')"><img src="assets/photo-${i}.jpg" alt="Photo ${i+1}"></button>`).join('')}</div>`);}
function setXDraftPhoto(path){if(!xMedia(path))return;xState.draft.media=path;saveX();closeSheet();show('xcompose');}
function submitXPost(){
 const d=xState.draft,text=d.text.trim();if(Array.from(d.text).length>280||(!text&&!d.media&&!d.quoteId))return false;
 if((d.replyTo&&!xPost(d.replyTo))||(d.quoteId&&!xPost(d.quoteId)))return false;
 if((d.replyTo&&xState.replies.length>=500)||(!d.replyTo&&xState.posts.length>=100)){toastAU('Your local timeline is full.');return false;}
 const id='mine-'+Date.now()+'-'+Math.random().toString(36).slice(2,9),target=d.replyTo;
 if(target){xState.replies.push({id,postId:target,text,time:nowAmpm(),media:d.media});}else xState.posts.unshift({id,text,time:nowAmpm(),quoteId:d.quoteId,media:d.media});
 xState.draft={text:'',replyTo:'',quoteId:'',media:''};saveX();xTrail=[];xScroll={};if(target){xPostId=target;show('xpost','pop');}else show('x','pop');toastAU(target?'Your reply was sent.':'Your post was sent.');return true;
}

let xWidgetsPromise=null;
function loadXWidgets(){
 if(window.twttr?.widgets?.createTweet)return Promise.resolve(window.twttr.widgets);
 if(xWidgetsPromise)return xWidgetsPromise;
 xWidgetsPromise=new Promise((resolve,reject)=>{
  const script=document.createElement('script');script.src='https://platform.twitter.com/widgets.js';script.async=true;
  const timeout=setTimeout(()=>{script.remove();reject(new Error('X timed out'));},12000);
  script.onload=()=>{clearTimeout(timeout);if(window.twttr?.widgets?.createTweet)resolve(window.twttr.widgets);else reject(new Error('X unavailable'));};
  script.onerror=()=>{clearTimeout(timeout);script.remove();reject(new Error('X unavailable'));};
  document.head.appendChild(script);
 }).catch(error=>{xWidgetsPromise=null;throw error;});
 return xWidgetsPromise;
}
async function mountXPosts(pg){
 let widgets;
 try{widgets=await loadXWidgets();}catch{if(pg.isConnected)pg.querySelectorAll('.x-load-status').forEach(el=>{el.textContent='Couldn’t load this post. Open it on X or try refreshing.';});return;}
 if(!pg.isConnected)return;
 await Promise.all(X_POSTS.map(async post=>{
  const slot=pg.querySelector('#x-post-'+post.id),status=pg.querySelector('#x-status-'+post.id);
  if(!slot||!status)return;
  try{
   const embedded=await widgets.createTweet(post.id,slot,{theme:'light',dnt:true,conversation:'none',align:'center',lang:'en'});
   if(!pg.isConnected)return;
   status.hidden=!!embedded;
   const fallback=pg.querySelector('#x-fallback-'+post.id);if(fallback)fallback.hidden=!!embedded;
   if(!embedded)status.textContent='This post is unavailable here. Open it on X.';
  }catch{if(pg.isConnected)status.textContent='Couldn’t load this post. Open it on X.';}
 }));
}

// Device continuity stays separate from story choices so old story saves remain readable.
const DEVICE_KEY='bandung-device-v2';
let phoneLast={},phoneScroll={},phonePinned={},phoneDrafts={},screenChatId=chatId,changingPhoneScreen=false;
let devicePrefs={airplane:false,wifi:true,bluetooth:true,notifications:true,focus:false},deviceSetting='Wi-Fi';
const ownView=id=>typeof id==='string'&&Object.hasOwn(VIEWS,id);
const bounded=(n,max=1e7)=>Number.isFinite(n)&&n>=0&&n<=max;
function phoneScreenKey(id=view){return id+'|'+(id==='chat'?screenChatId:id==='note'?noteId:id==='maild'?mailId:id==='safarireader'?safariReadId:'');}
function rememberPhoneScreen(suspend=false){
 if(changingPhoneScreen||!ownView(view)||['lock','pin','home'].includes(view))return;
 const sc=$('.pg[data-view="'+view+'"] '+(view==='chat'?'.msgs':'.scroll'));
 if(sc){phoneScroll[phoneScreenKey()]=sc.scrollTop||0;if(view==='chat')phonePinned[phoneScreenKey()]=nearChatBottom(sc);}
 const root=rootOf(view);
 phoneLast[root]={view,chatId:view==='chat'?screenChatId:chatId,noteId,mailId,article:safariReadId,setting:deviceSetting};
 if(view==='chat'){
  phoneDrafts[screenChatId]={text:composerDraft,pending:pendingText,choice:composerChoice,step:storyChoices.length,keyboard:!!$('#kbd')?.classList.contains('open')};
  if(suspend){typingEpoch++;composerTyping=false;}
 }
 if(view.startsWith('x')){xRemember();phoneLast[root].x={post:xPostId,profile:xProfileHandle,profileTab:xProfileTab,dm:xDmHandle,timeline:xTimeline};}
}
function restorePhoneScreen(id,pg){
 if(id==='chat'){
  screenChatId=chatId;const draft=phoneDrafts[chatId];
  if(draft&&draft.step===storyChoices.length&&chatId==='Hanni'){
   composerChoice=draft.choice;pendingText=draft.pending;setField(draft.text,!!draft.text);
   if(pendingText)$('#snd')?.classList.add('on');
   if(draft.keyboard){$('#kbd')?.classList.add('open');$('#cin')?.classList.remove('safe');}
  }
  const sc=pg.querySelector('.msgs');const top=phoneScroll[phoneScreenKey()];
  if(sc&&top!==undefined){if(phonePinned[phoneScreenKey()])scrollChat();else sc.scrollTop=top;}
  sc?.addEventListener('scroll',()=>{if(nearChatBottom(sc))clearNewChat()},{passive:true});
 }else if(!id.startsWith('x')){const sc=pg.querySelector('.scroll'),top=phoneScroll[phoneScreenKey(id)];if(sc&&top!==undefined)sc.scrollTop=top;}
}
const showBeforeDevice=show;
show=function(id,anim='swap'){
 rememberPhoneScreen(true);changingPhoneScreen=true;let pg;
 try{pg=showBeforeDevice(id,anim);restorePhoneScreen(id,pg);}finally{changingPhoneScreen=false;}
 saveDeviceState(false);return pg;
};

 openBeforeDevice(id,el);
};
function resetPhoneSessions(){phoneLast={};phoneScroll={};phonePinned={};phoneDrafts={};clearNewChat();}
function validDeviceState(s){
 const text=(v,n)=>typeof v==='string'&&v.length<=n;
 return !!s&&s.version===1&&Number.isInteger(s.clock)&&s.clock>=437&&s.clock<=1439
 &&s.prefs&&Object.keys(devicePrefs).every(k=>typeof s.prefs[k]==='boolean')
 &&s.unread&&Object.entries(s.unread).every(([k,n])=>chatNames.includes(k)&&Number.isInteger(n)&&bounded(n,1000))
 &&Number.isInteger(s.hanniUnread)&&bounded(s.hanniUnread,1000)&&Number.isInteger(s.declined)&&bounded(s.declined,1000)
 &&Array.isArray(s.calls)&&s.calls.length<=100&&s.calls.every(c=>Array.isArray(c)&&c.length===3&&text(c[0],80)&&(chatNames.includes(c[0])||Object.hasOwn(OTHER_CALLS,c[0])||/^[0-9*#]{1,20}$/.test(c[0]))&&/^오늘 \d{1,2}:\d{2}$/.test(c[1])&&['발신','수신','부재중'].includes(c[2]))
 &&Array.isArray(s.notes)&&s.notes.length<=30&&s.notes.every(n=>n&&text(n.title,100)&&text(n.body,2000)&&['kakao','phone','rem'].includes(n.app)&&text(n.time,30))
 &&s.scroll&&Object.keys(s.scroll).length<=200&&Object.entries(s.scroll).every(([k,n])=>ownView(k.split('|')[0])&&k.length<150&&bounded(n))
 &&(s.pinned===undefined||s.pinned&&Object.keys(s.pinned).length<=200&&Object.entries(s.pinned).every(([k,v])=>ownView(k.split('|')[0])&&k.length<150&&typeof v==='boolean'))
 &&s.last&&Object.keys(s.last).length<=40&&Object.entries(s.last).every(([k,v])=>ownView(k)&&v&&ownView(v.view)&&rootOf(v.view)===k&&chatNames.includes(v.chatId)&&Number.isInteger(v.noteId)&&bounded(v.noteId,notes.length-1)&&Number.isInteger(v.mailId)&&bounded(v.mailId,emails.length-1)&&SAFARI_READS.some(a=>a.id===v.article)&&text(v.setting,80)&&(v.x===undefined||v.x&&text(v.x.post,120)&&xHandle(v.x.profile)&&xHandle(v.x.dm)&&['posts','replies','media'].includes(v.x.profileTab)&&['forYou','following'].includes(v.x.timeline)))
 &&(s.xScroll===undefined||s.xScroll&&Object.keys(s.xScroll).length<=300&&Object.entries(s.xScroll).every(([k,n])=>k.startsWith('x')&&ownView(k.split('|')[0])&&k.length<200&&bounded(n)))
 &&(s.tools===undefined||s.tools&&(s.tools.watchStart===null||bounded(s.tools.watchStart,Date.now()))&&bounded(s.tools.watchElapsed,31536000)&&bounded(s.tools.timerDeadline,Date.now()+10800000)&&Number.isInteger(s.tools.timerSeconds)&&s.tools.timerSeconds>=60&&s.tools.timerSeconds<=10800&&typeof s.tools.digits==='string'&&/^[0-9*#]{0,20}$/.test(s.tools.digits))
 &&s.drafts&&Object.entries(s.drafts).every(([k,v])=>chatNames.includes(k)&&v&&text(v.text,2000)&&text(v.pending,2000)&&[0,1].includes(v.choice)&&Number.isInteger(v.step)&&bounded(v.step,STORY_BEATS.length)&&typeof v.keyboard==='boolean');
}
function saveDeviceState(remember=true){
 if(remember&&!changingPhoneScreen)rememberPhoneScreen();
 extraCalls=extraCalls.slice(0,100);lockNotes=lockNotes.slice(0,30);
 try{localStorage.setItem(DEVICE_KEY,JSON.stringify({version:1,clock:nowMin(),prefs:devicePrefs,unread,hanniUnread,declined,calls:extraCalls,notes:lockNotes,last:phoneLast,scroll:phoneScroll,pinned:phonePinned,drafts:phoneDrafts,xScroll,tools:{watchStart,watchElapsed,timerDeadline,timerSeconds,digits:dialDigits}}));}catch{storageAvailable=false;}
}
function restoreDeviceState(){
 try{const raw=localStorage.getItem(DEVICE_KEY);if(!raw){const old=localStorage.getItem('softlaunch-device-v1');if(old&&old.length<=100000){const s=JSON.parse(old);if(validDeviceState(s))devicePrefs=Object.fromEntries(Object.keys(devicePrefs).map(k=>[k,s.prefs[k]]));}return;}if(raw.length>100000)return;const s=JSON.parse(raw);if(!validDeviceState(s))return;
  storyMinute=s.clock;devicePrefs={...s.prefs};unread={...s.unread};hanniUnread=s.hanniUnread;declined=s.declined;extraCalls=s.calls;lockNotes=s.notes;phoneLast=s.last;phoneScroll=s.scroll;phonePinned=s.pinned||{};phoneDrafts=s.drafts;xScroll=s.xScroll||{};if(s.tools){watchStart=s.tools.watchStart;watchElapsed=s.tools.watchElapsed;timerDeadline=s.tools.timerDeadline;timerSeconds=s.tools.timerSeconds;dialDigits=s.tools.digits;}
 }catch{}
}
